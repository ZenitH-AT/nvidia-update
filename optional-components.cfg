//* Optional driver components (uncomment start of line to include in install) *//

// Note: This configuration file was written for version 1.16.0 of nvidia-update (akantorx fork).
// By default only the graphics driver is installed (plus Optimus support, which only exists in notebook driver packages).
// Components that are not listed here (Display.Driver, NVI2, setup files) are always installed.

/* Core Functionality */
Display.Optimus // Optimus support (laptops with integrated + NVIDIA graphics); ignored on desktops
// HDAudio // HD Audio Driver; only needed for audio over HDMI/DisplayPort (monitor, TV, AV receiver)
// PhysX // PhysX; only needed by some older games with GPU PhysX (e.g., Borderlands 2, Batman: Arkham series, Mirror's Edge)
// PPC // USB Type-C device driver; only needed for RTX 20 series cards with a USB-C (VirtualLink) port

/* GeForce Experience / NVIDIA App */
// GFExperience // GeForce Experience
// GFExperience.NvStreamSrv // GeForce Experience streaming service
// ShadowPlay // ShadowPlay

/*  Miscellaneous */
// Display.Nview // nView
// Display.Update // Display driver automatic updater (not nvidia-update script)
// FrameViewSDK // FrameView SDK
// MSVCRT // Visual C++ runtime components
// nodejs // Node.js
// NvAbHub // AbHub
// NvBackend // NVIDIA Backend
// NvCamera // ANSEL
// NvContainer // NvContainer
// NvModuleTracker // Process and module monitoring driver
// NVPCF // NVIDIA Platform Controllers and Framework
// NvTelemetry // Telemetry
// NvVAD // Virtual Audio Driver
// NvvHCI // Virtual Host Controller Interface driver
// ShieldWirelessController // Shield wireless controller support
// Update.Core // Update core
